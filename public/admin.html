<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Ziyad Template Studio</title>
    <!-- Tailwind CSS (via CDN for simplicity in static file) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --bg-main: #0B1121;
            --bg-card: #111827;
            --accent: #10B981;
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--bg-main); color: #F9FAFB; }

        /* Lock Screen */
        #lock-screen {
            position: fixed; inset: 0; background: var(--bg-main); z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        /* Drag & Drop */
        .drop-zone {
            transition: all 0.3s ease;
            background-color: rgba(255, 255, 255, 0.02);
        }
        .drop-zone.dragover {
            border-color: var(--accent);
            background-color: rgba(16, 185, 129, 0.1);
        }

        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top: 3px solid var(--accent);
            width: 20px; height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Lock Screen -->
    <div id="lock-screen">
        <div class="bg-gray-800 p-8 rounded-xl border border-gray-700 text-center w-full max-w-sm shadow-2xl">
            <h2 class="text-2xl font-bold mb-6 text-white">Admin Access</h2>
            <input type="password" id="access-code" placeholder="Masukkan Kode Akses"
                   class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg text-white mb-4 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            <button onclick="checkCode()"
                    class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 rounded-lg transition-colors">
                Masuk
            </button>
            <p id="lock-error" class="text-red-500 mt-4 text-sm"></p>
        </div>
    </div>

    <!-- Admin Panel -->
    <div id="admin-panel" class="hidden max-w-4xl mx-auto py-12 px-4">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-bold text-white">Tambah Produk Baru</h1>
            <p class="text-gray-400 mt-2">Upload produk ke Firebase Firestore & Storage</p>
        </div>

        <form id="product-form" class="bg-gray-800 p-8 rounded-2xl border border-gray-700 shadow-xl space-y-6">

            <div class="grid md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-gray-400 mb-2 font-medium">Nama Produk</label>
                    <input type="text" name="name" required placeholder="Contoh: Template Toko Online"
                           class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg text-white focus:border-emerald-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-gray-400 mb-2 font-medium">Judul Singkat</label>
                    <input type="text" name="title" required placeholder="Contoh: Modern & Responsif"
                           class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg text-white focus:border-emerald-500 focus:outline-none">
                </div>
            </div>

            <div>
                <label class="block text-gray-400 mb-2 font-medium">Deskripsi</label>
                <textarea name="description" required rows="4" placeholder="Deskripsi lengkap produk..."
                          class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg text-white focus:border-emerald-500 focus:outline-none"></textarea>
            </div>

            <div class="grid md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-gray-400 mb-2 font-medium">Harga (Rp)</label>
                    <input type="number" name="price" required min="1" placeholder="150000"
                           class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg text-white focus:border-emerald-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-gray-400 mb-2 font-medium">Link Produk (Lynk.id/dll)</label>
                    <input type="url" name="lynkUrl" required placeholder="https://lynk.id/..."
                           class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg text-white focus:border-emerald-500 focus:outline-none">
                </div>
            </div>

            <div>
                <label class="block text-gray-400 mb-2 font-medium">Gambar Produk (Max 10)</label>
                <div class="drop-zone border-2 border-dashed border-gray-600 rounded-xl p-8 text-center cursor-pointer hover:border-emerald-500" id="drop-zone">
                    <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                    </svg>
                    <p class="mt-2 text-gray-300">Drag & drop gambar di sini atau klik untuk memilih</p>
                    <p class="text-sm text-gray-500 mt-1">JPG, PNG, WEBP (Max 5MB)</p>
                    <input type="file" id="file-input" multiple accept="image/png, image/jpeg, image/webp" class="hidden">
                </div>
                <div class="preview-grid grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-4 mt-6" id="preview-grid"></div>
            </div>

            <div class="pt-4 border-t border-gray-700 flex justify-end">
                <button type="submit" id="submit-btn"
                        class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-8 rounded-lg transition-colors flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                    <span>Simpan Produk</span>
                </button>
            </div>
        </form>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed top-5 right-5 bg-gray-800 text-white px-6 py-4 rounded-lg shadow-xl border-l-4 border-emerald-500 transform translate-x-full transition-transform duration-300 z-50 flex items-center gap-3">
        <span id="toast-icon">✅</span>
        <p id="toast-message">Berhasil disimpan!</p>
    </div>

    <!-- Firebase Config -->
    <script src="firebase-config.js"></script>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        // Initialize Firebase
        let db, storage;
        try {
            const app = initializeApp(window.firebaseConfig);
            db = getFirestore(app);
            storage = getStorage(app);
            console.log("Firebase initialized successfully");
        } catch (e) {
            console.error("Firebase init error:", e);
            alert("Gagal menginisialisasi Firebase. Pastikan firebase-config.js sudah diisi dengan benar.");
        }

        // Global Variables
        const ACCESS_CODE = "15-zyd@2-010";
        let files = [];

        // --- 1. Lock Screen Logic ---
        window.checkCode = function() {
            const input = document.getElementById('access-code').value;
            if (input === ACCESS_CODE) {
                document.getElementById('lock-screen').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                sessionStorage.setItem('admin_token', input);
            } else {
                document.getElementById('lock-error').textContent = "Kode akses salah!";
            }
        }

        if (sessionStorage.getItem('admin_token') === ACCESS_CODE) {
            checkCode();
        }

        // --- 2. Drag & Drop Logic ---
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const previewGrid = document.getElementById('preview-grid');

        dropZone.addEventListener('click', () => fileInput.click());

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        dropZone.addEventListener('dragover', () => dropZone.classList.add('dragover'));
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', handleDrop);
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        function handleDrop(e) {
            dropZone.classList.remove('dragover');
            const dt = e.dataTransfer;
            handleFiles(dt.files);
        }

        function handleFiles(newFiles) {
            const MAX_SIZE = 5 * 1024 * 1024; // 5MB

            Array.from(newFiles).forEach(file => {
                if (file.size > MAX_SIZE) {
                    showToast(`File ${file.name} terlalu besar (>5MB)`, 'error');
                    return;
                }

                // Add to array
                files.push(file);

                // Preview
                const reader = new FileReader();
                reader.onload = (e) => {
                    const div = document.createElement('div');
                    div.className = 'relative aspect-square bg-gray-900 rounded-lg overflow-hidden border border-gray-700 group';
                    div.innerHTML = `
                        <img src="${e.target.result}" class="w-full h-full object-cover">
                        <button type="button" class="absolute top-1 right-1 bg-red-500 text-white rounded-full p-1 opacity-0 group-hover:opacity-100 transition-opacity" onclick="removeFile('${file.name}', this)">
                            <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                        </button>
                    `;
                    previewGrid.appendChild(div);
                };
                reader.readAsDataURL(file);
            });
        }

        window.removeFile = (fileName, btn) => {
            files = files.filter(f => f.name !== fileName);
            btn.parentElement.remove();
        }

        // --- 3. Form Submission ---
        document.getElementById('product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');

            if (files.length === 0) {
                showToast('Upload minimal 1 gambar', 'error');
                return;
            }

            // UI Loading State
            const originalBtnContent = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<div class="loader"></div> <span>Mengupload...</span>`;

            try {
                // 1. Upload Images to Firebase Storage
                const imageUrls = [];

                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    // Create unique path: products/{timestamp}_{random}_{filename}
                    const path = `products/${Date.now()}_${Math.floor(Math.random()*1000)}_${file.name}`;
                    const storageRef = ref(storage, path);

                    const snapshot = await uploadBytes(storageRef, file);
                    const downloadURL = await getDownloadURL(snapshot.ref);

                    imageUrls.push({
                        url: downloadURL,
                        isThumbnail: i === 0
                    });
                }

                // 2. Save Data to Firestore
                const formData = new FormData(e.target);
                const productData = {
                    name: formData.get('name'),
                    title: formData.get('title'),
                    description: formData.get('description'),
                    price: Number(formData.get('price')),
                    lynkUrl: formData.get('lynkUrl'),
                    images: imageUrls,
                    createdAt: serverTimestamp(),
                    updatedAt: serverTimestamp()
                };

                await addDoc(collection(db, "products"), productData);

                showToast('Produk Berhasil Disimpan!', 'success');
                e.target.reset();
                files = [];
                previewGrid.innerHTML = '';

            } catch (error) {
                console.error("Error adding document: ", error);
                showToast('Gagal menyimpan: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalBtnContent;
            }
        });

        // Toast Helper
        function showToast(msg, type) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = msg;
            document.getElementById('toast-icon').textContent = type === 'success' ? '✅' : '❌';
            toast.className = `fixed top-5 right-5 px-6 py-4 rounded-lg shadow-xl border-l-4 transform transition-transform duration-300 z-50 flex items-center gap-3 ${type === 'success' ? 'bg-gray-800 text-white border-emerald-500' : 'bg-gray-800 text-white border-red-500'} translate-x-0`;

            setTimeout(() => {
                toast.classList.add('translate-x-full');
            }, 3000);
        }
    </script>
</body>
</html>
