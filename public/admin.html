<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Ziyad Template Studio</title>
    <!-- Tailwind CSS (via CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --bg-main: #0B1121;
            --bg-card: #111827;
            --accent: #10B981;
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--bg-main); color: #F9FAFB; }

        /* Lock Screen */
        #lock-screen {
            position: fixed; inset: 0; background: var(--bg-main); z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top: 3px solid var(--accent);
            width: 20px; height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Lock Screen -->
    <div id="lock-screen">
        <div class="bg-gray-800 p-8 rounded-xl border border-gray-700 text-center w-full max-w-sm shadow-2xl">
            <h2 class="text-2xl font-bold mb-6 text-white">Admin Access</h2>
            <input type="password" id="access-code" placeholder="Masukkan Kode Akses"
                   class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg text-white mb-4 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            <button id="btn-login"
                    class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 rounded-lg transition-colors">
                Masuk
            </button>
            <p id="lock-error" class="text-red-500 mt-4 text-sm"></p>
        </div>
    </div>

    <!-- Admin Panel -->
    <div id="admin-panel" class="hidden max-w-4xl mx-auto py-12 px-4">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-bold text-white">Tambah Produk Baru</h1>
            <p class="text-gray-400 mt-2">Simpan data produk ke Firestore (Image URLs)</p>
        </div>

        <form id="product-form" class="bg-gray-800 p-8 rounded-2xl border border-gray-700 shadow-xl space-y-6">

            <div class="grid md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-gray-400 mb-2 font-medium">Nama Produk</label>
                    <input type="text" name="name" required placeholder="Contoh: Template Toko Online"
                           class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg text-white focus:border-emerald-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-gray-400 mb-2 font-medium">Judul Singkat</label>
                    <input type="text" name="title" required placeholder="Contoh: Modern & Responsif"
                           class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg text-white focus:border-emerald-500 focus:outline-none">
                </div>
            </div>

            <div>
                <label class="block text-gray-400 mb-2 font-medium">Deskripsi</label>
                <textarea name="description" required rows="4" placeholder="Deskripsi lengkap produk..."
                          class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg text-white focus:border-emerald-500 focus:outline-none"></textarea>
            </div>

            <div class="grid md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-gray-400 mb-2 font-medium">Harga (Rp)</label>
                    <input type="number" name="price" required min="1" placeholder="150000"
                           class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg text-white focus:border-emerald-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-gray-400 mb-2 font-medium">Link Produk (Lynk.id/dll)</label>
                    <input type="url" name="lynkUrl" required placeholder="https://lynk.id/..."
                           class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg text-white focus:border-emerald-500 focus:outline-none">
                </div>
            </div>

            <!-- Image URLs Input (Replaces File Upload) -->
            <div>
                <label class="block text-gray-400 mb-2 font-medium">Link Gambar (URL)</label>
                <div class="bg-gray-900 border border-gray-700 rounded-lg p-4">
                    <textarea name="imageUrls" required rows="5" placeholder="https://example.com/image1.jpg&#10;https://example.com/image2.jpg&#10;..."
                              class="w-full bg-transparent text-white focus:outline-none resize-y font-mono text-sm"></textarea>
                </div>
                <p class="text-sm text-gray-500 mt-2">
                    * Masukkan satu link gambar per baris.<br>
                    * Link baris pertama akan menjadi thumbnail.<br>
                    * Maksimal 10 gambar.
                </p>
            </div>

            <div class="pt-4 border-t border-gray-700 flex justify-end">
                <button type="submit" id="submit-btn"
                        class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-8 rounded-lg transition-colors flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                    <span>Simpan Produk</span>
                </button>
            </div>
        </form>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed top-5 right-5 bg-gray-800 text-white px-6 py-4 rounded-lg shadow-xl border-l-4 border-emerald-500 transform translate-x-full transition-transform duration-300 z-50 flex items-center gap-3">
        <span id="toast-icon">✅</span>
        <p id="toast-message">Berhasil disimpan!</p>
    </div>

    <!-- Firebase Config -->
    <script src="firebase-config.js"></script>

    <!-- Firebase SDKs (Only App & Firestore, NO Storage) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Initialize Firebase
        let db;
        try {
            const app = initializeApp(window.firebaseConfig);
            db = getFirestore(app);
            console.log("Firebase initialized successfully (Firestore Only)");
        } catch (e) {
            console.error("Firebase init error:", e);
            alert("Gagal menginisialisasi Firebase. Pastikan firebase-config.js sudah diisi dengan benar.");
        }

        // Global Variables
        const ACCESS_CODE = "15-zyd@2-010";

        // --- 1. Lock Screen Logic ---
        const checkCode = () => {
            const input = document.getElementById('access-code').value;
            if (input === ACCESS_CODE) {
                document.getElementById('lock-screen').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                sessionStorage.setItem('admin_token', input);
            } else {
                document.getElementById('lock-error').textContent = "Kode akses salah!";
            }
        };

        // Event Listener for Login Button
        document.getElementById('btn-login').addEventListener('click', checkCode);

        // Allow Enter key to login
        document.getElementById('access-code').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkCode();
        });

        // Auto-login check
        if (sessionStorage.getItem('admin_token') === ACCESS_CODE) {
            checkCode();
        }

        // --- 2. Form Submission ---
        document.getElementById('product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');

            // Get URLs from textarea
            const formData = new FormData(e.target);
            const rawUrls = formData.get('imageUrls').trim();

            if (!rawUrls) {
                showToast('Masukkan minimal satu link gambar', 'error');
                return;
            }

            // Process URLs: Split by newline, trim, filter empty, limit to 10
            const urlList = rawUrls.split('\n')
                .map(url => url.trim())
                .filter(url => url.length > 0)
                .slice(0, 10); // Max 10

            if (urlList.length === 0) {
                showToast('Link gambar tidak valid', 'error');
                return;
            }

            // Create Image Objects
            const images = urlList.map((url, index) => ({
                url: url,
                isThumbnail: index === 0
            }));

            // UI Loading State
            const originalBtnContent = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<div class="loader"></div> <span>Menyimpan...</span>`;

            try {
                // Save Data to Firestore
                const productData = {
                    name: formData.get('name'),
                    title: formData.get('title'),
                    description: formData.get('description'),
                    price: Number(formData.get('price')),
                    lynkUrl: formData.get('lynkUrl'),
                    images: images,
                    createdAt: serverTimestamp(),
                    updatedAt: serverTimestamp()
                };

                await addDoc(collection(db, "products"), productData);

                showToast('Produk Berhasil Disimpan!', 'success');
                e.target.reset();

            } catch (error) {
                console.error("Error adding document: ", error);
                showToast('Gagal menyimpan: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalBtnContent;
            }
        });

        // Toast Helper
        function showToast(msg, type) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = msg;
            document.getElementById('toast-icon').textContent = type === 'success' ? '✅' : '❌';
            toast.className = `fixed top-5 right-5 px-6 py-4 rounded-lg shadow-xl border-l-4 transform transition-transform duration-300 z-50 flex items-center gap-3 ${type === 'success' ? 'bg-gray-800 text-white border-emerald-500' : 'bg-gray-800 text-white border-red-500'} translate-x-0`;

            setTimeout(() => {
                toast.classList.add('translate-x-full');
            }, 3000);
        }
    </script>
</body>
</html>
